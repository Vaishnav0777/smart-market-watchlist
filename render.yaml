# Render Blueprint for Smart Market Watchlist.
# Secrets are generated or entered in the dashboard. Do not put real values here.

databases:
  - name: smartwatch-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: singapore
    databaseName: smartwatch
    user: smartwatch
    ipAllowList: []

services:
  - type: web
    name: smartwatch-api
    runtime: docker
    repo: https://github.com/Vaishnav0777/smart-market-watchlist.git
    branch: main
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_USERNAME
        fromDatabase:
          name: smartwatch-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: smartwatch-db
          property: password
      # Spring requires a JDBC URL. Render's connectionString is postgresql://...
      # and Blueprint files cannot rewrite it. Enter the internal JDBC URL once.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: smartwatch-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPSTOX_ENABLED
        value: "false"
      - key: UPSTOX_ACCESS_TOKEN
        sync: false

  - type: web
    name: smartwatch-web
    runtime: docker
    repo: https://github.com/Vaishnav0777/smart-market-watchlist.git
    branch: main
    region: singapore
    plan: 0.5c-512mb
    rootDir: frontend
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: API_PROXY_TARGET
        fromService:
          name: smartwatch-api
          type: web
          property: hostport
