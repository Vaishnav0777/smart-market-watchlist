# Render Blueprint for Smart Market Watchlist.
# PostgreSQL is external (Neon Free). Secrets are generated or entered in the dashboard.
# Do not put real values here.

services:
  - type: web
    name: smartwatch-api
    runtime: docker
    repo: https://github.com/Vaishnav0777/smart-market-watchlist.git
    branch: main
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      # Spring reads these separately and does not parse credentials out of the URL.
      # Use the Neon JDBC URL, for example jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: smartwatch-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPSTOX_ENABLED
        value: "false"
      - key: UPSTOX_ACCESS_TOKEN
        sync: false

  - type: web
    name: smartwatch-web
    runtime: docker
    repo: https://github.com/Vaishnav0777/smart-market-watchlist.git
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: API_PROXY_TARGET
        fromService:
          name: smartwatch-api
          type: web
          property: hostport
