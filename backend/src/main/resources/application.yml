spring:
  application:
    name: smart-market-watchlist
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwatch}
    username: ${DATABASE_USERNAME:smartwatch}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    cookie:
      secure: ${COOKIE_SECURE:false}
  changes:
    price-move-percent: 2
    volume-spike-multiple: 2
    gap-percent: 1
    intraday-move-percent: 2
    high-severity-multiple: 2

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
