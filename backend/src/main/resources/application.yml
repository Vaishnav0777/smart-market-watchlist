spring:
  application:
    name: smart-market-watchlist
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwatch}
    username: ${DATABASE_USERNAME:smartwatch}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
